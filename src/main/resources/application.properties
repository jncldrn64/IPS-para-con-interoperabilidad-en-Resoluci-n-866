spring.application.name=ips
# La fase 0 corre en terminal: sin esto arrancan Tomcat en el puerto 8080 y Spring Security.
spring.main.web-application-type=none
# Por la terminal sale solo el menú. Sin estas dos, el cartel y 19 líneas de log de arranque y de
# cierre salen entre sus líneas; los avisos y los errores siguen saliendo (docs/DESIGN.md,
# sección 4).
logging.level.root=warn
spring.main.banner-mode=off
# pom.xml trae Thymeleaf, y la fase 0 no tiene plantillas: sin esto, cada arranque avisa que no
# encuentra classpath:/templates/.
spring.thymeleaf.check-template-location=false
# H2 en archivo: los datos quedan entre corridas. Es la base de prueba, que IpsApplication.main
# copia de data/ips.mv.db si no existe; quien tiene el turno abre data/ips pasando su URL al
# arrancar (docs/DESIGN.md, sección 8).
spring.datasource.url=jdbc:h2:file:./data/prueba
spring.jpa.hibernate.ddl-auto=update
